version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: 构建 Windows 可执行文件到 {{.BIN_DIR}}/{{.APP_NAME}}.exe
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
    cmds:
      - task: generate:syso
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      - cmd: powershell -NoProfile -Command "Remove-Item -Force *.syso -ErrorAction SilentlyContinue"
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      # 两个模式的区别是**有没有控制台**：生产构建带 -H windowsgui（PE 子系统
      # 为 GUI），进程没有控制台，os.Stdout 句柄无效——这正是 logging 包必须
      # 用 teeWriter 而不是 io.MultiWriter 的原因（见该包注释与 AGENTS.md）。
      # dev 构建不加它，好让 `wails3 dev` 能在终端里看到 slog 输出。
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui"{{end}}'
    env:
      GOOS: windows
      # 本应用没有 CGO 依赖（Win32 调用走 golang.org/x/sys），关掉可以让
      # CI 不必依赖 MinGW，交叉编译也更省事
      CGO_ENABLED: '0'
      GOARCH: '{{.ARCH | default ARCH}}'

  generate:syso:
    summary: 生成 Windows 版本资源与清单（嵌入 exe 的图标/版本信息）
    dir: build
    cmds:
      # info.json 里的 fixed.file_version 与字符串表都必须是当前版本号；
      # 它由 scripts/check-config-sync.mjs 与 build/config.yml 锁死一致。
      - wails3 generate syso -arch {{.ARCH | default ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH | default ARCH}}.syso

  run:
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
