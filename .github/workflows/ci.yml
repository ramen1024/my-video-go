name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    # 只用 windows-latest：路径语义测试依赖 Windows 行为（磁盘根目录判定等），
    # 且本项目以 Windows 为目标平台
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 前端检查（svelte-check + 配置一致性）
        working-directory: frontend
        run: pnpm check

      - name: 前端构建（含产物形状校验）
        working-directory: frontend
        run: pnpm build

      - name: gofmt 检查
        run: |
          $files = gofmt -l .
          if ($files) { Write-Host $files; exit 1 }

      - name: go vet
        run: go vet ./...

      # staticcheck 是 AGENTS.md 里"clippy 等价物"的答案。用 go run 免安装、
      # 且把版本钉死，避免某次 CI 升级工具后冒出一批新告警导致全库红。
      # 版本升级是显式动作：本地跑 `go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...`
      # 清零告警后，再改这里的版本号。
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: go test
        run: go test ./...

      # 端到端编译验证：必须在 pnpm build 之后（go:embed 需要 frontend/dist 有产物）
      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: wails build
        run: |
          $env:PATH += ";$(go env GOPATH)\bin"
          wails build
