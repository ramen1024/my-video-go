name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    # 只用 windows-latest：路径语义测试依赖 Windows 行为（磁盘根目录判定等），
    # 且本项目以 Windows 为目标平台
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v6
        with:
          # 必须钉死，不能用 stable：staticcheck 靠读取编译器导出数据工作，
          # 该格式随 Go 版本递增（1.27.1 产出 v4、1.27.2 产出 v5，而
          # staticcheck v0.8.1 只支持到 v4，直接报
          # "export data version 5 is greater than maximum supported version 4"）。
          # 同时 wails build 用的也是这个 Go——钉死它才能保证任何人、任何时间
          # 跑 CI 都得到同一结果。
          # 注意 setup-go 会设 GOTOOLCHAIN=local（日志里可见），所以这行在 CI 上
          # 是**硬**钉死：go.mod 要求高于它时不会自动下载，而是直接报
          # "go.mod requires go >= X (running go Y; GOTOOLCHAIN=local)"。
          # 危险的漂移在开发机：那里 GOTOOLCHAIN 默认 auto，go.mod 要求更高版本时
          # Go 会静默下载并换用那个工具链，"本机绿"于是不再代表 CI 绿。
          # 升级 Go 时必须五处一起动：这里与 release.yml 的 go-version、
          # 两处的 staticcheck 版本、go.mod 的 go 指令，
          # 并先在本地确认 `go run ...@<新版> ./...` 清零告警。
          go-version: '1.27.2'
          cache: true

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 前端检查（svelte-check + 配置一致性）
        working-directory: frontend
        run: pnpm check

      - name: 前端构建（含产物形状校验）
        working-directory: frontend
        run: pnpm build

      - name: gofmt 检查
        run: |
          $files = gofmt -l .
          if ($files) { Write-Host $files; exit 1 }

      - name: go vet
        run: go vet ./...

      # staticcheck 是 AGENTS.md 里"clippy 等价物"的答案。用 go run 免安装、
      # 且把版本钉死，避免某次 CI 升级工具后冒出一批新告警导致全库红。
      # 版本升级是显式动作：本地跑 `go run honnef.co/go/tools/cmd/staticcheck@<新版> ./...`
      # 清零告警后，再改这里的版本号。
      # 注意它必须与上方 go-version 配对升级（详见 ci.yml 的 setup-go 注释）：
      # v0.8.2 起才支持 Go 1.27.2 的导出数据格式（v5）。
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      # 只跑 -race（需要 CGO/gcc，windows-latest 自带 MinGW，setup-go 会自动
      # 启用 CGO_ENABLED=1）：它是普通 go test 的超集，另跑一遍纯 go test 没有
      # 意义。注意 race 只能发现"被测试真正并发执行到"的路径（见 e6bc616 教训：
      # 测试全绿≠没问题），新加的并发代码必须同时补能并发触达它的测试。
      - name: go test -race
        run: go test -race ./...

      # 端到端编译验证：必须在 pnpm build 之后（go:embed 需要 frontend/dist 有产物）
      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: wails build
        run: |
          $env:PATH += ";$(go env GOPATH)\bin"
          wails build
