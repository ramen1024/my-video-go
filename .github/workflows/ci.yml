name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    # 只用 windows-latest：路径语义测试依赖 Windows 行为（磁盘根目录判定等），
    # 且本项目以 Windows 为目标平台
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v6
        with:
          # 必须钉死，不能用 stable：staticcheck 靠读取编译器导出数据工作，
          # 该格式随 Go 版本递增（本机 1.27.1 产出 v4，更新的 Go 产出 v5，
          # 超出 staticcheck v0.8.1 的支持范围直接报
          # "export data version 5 is greater than maximum supported version 4"）。
          # 同时 wails build 用的也是这个 Go——钉死它才能保证任何人、任何时间
          # 跑 CI 都得到同一结果。升级 Go 时必须连 staticcheck 版本一起升，
          # 并先在本地确认 `go run ...@<新版> ./...` 清零告警。
          go-version: '1.27.1'
          cache: true

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 前端检查（svelte-check + 配置一致性）
        working-directory: frontend
        run: pnpm check

      - name: 前端构建（含产物形状校验）
        working-directory: frontend
        run: pnpm build

      - name: gofmt 检查
        run: |
          $files = gofmt -l .
          if ($files) { Write-Host $files; exit 1 }

      - name: go vet
        run: go vet ./...

      # staticcheck 是 AGENTS.md 里"clippy 等价物"的答案。用 go run 免安装、
      # 且把版本钉死，避免某次 CI 升级工具后冒出一批新告警导致全库红。
      # 版本升级是显式动作：本地跑 `go run honnef.co/go/tools/cmd/staticcheck@<新版> ./...`
      # 清零告警后，再改这里的版本号。
      # 注意它必须与上方 go-version 配对升级（详见 ci.yml 的 setup-go 注释）。
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: go test
        run: go test ./...

      # 端到端编译验证：必须在 pnpm build 之后（go:embed 需要 frontend/dist 有产物）
      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: wails build
        run: |
          $env:PATH += ";$(go env GOPATH)\bin"
          wails build
