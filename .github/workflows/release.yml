name: Release

# 推送 v* 标签时自动构建并发布 Release，产物为单文件绿色版 exe
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 发版前必须过与 CI 相同的门槛：此前 release 只 build 不 check，
      # 于是"检查红灯的提交"照样能打出 exe 并发布出去。
      - name: 前端检查（svelte-check + 配置一致性）
        working-directory: frontend
        run: pnpm check

      # 必须在 wails build 之前（go:embed all:frontend/dist 要求 dist 有产物）
      - name: 前端构建
        working-directory: frontend
        run: pnpm build

      - name: gofmt 检查
        run: |
          $files = gofmt -l .
          if ($files) { Write-Host $files; exit 1 }

      - name: go vet
        run: go vet ./...

      # 与 ci.yml 相同的 staticcheck 门槛（发版前必须同样干净）
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: go test
        run: go test ./...

      # tag 名与产品版本号必须一致：不对的话会发布一个"自称别的版本"的 exe，
      # 而那时 tag 已经推了（已发布过的 tag 不宜原地重打）。
      - name: 校验 tag 与产品版本号一致
        shell: pwsh
        run: |
          $version = (Get-Content wails.json -Raw | ConvertFrom-Json).info.productVersion
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            Write-Host "tag 为 $env:GITHUB_REF_NAME，但 wails.json 的 productVersion 是 $version（应为 $expected）"
            exit 1
          }
          Write-Host "版本一致: $expected"

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: wails build
        run: |
          $env:PATH += ";$(go env GOPATH)\bin"
          wails build

      # 产物文件名含中文（wails.json 的 outputfilename），附件统一为 ASCII 名
      - name: 归一化产物文件名
        shell: pwsh
        run: |
          $exe = Get-ChildItem "build/bin/*.exe" | Select-Object -First 1
          $dest = "video-scanner-$($env:GITHUB_REF_NAME)-windows-amd64.exe"
          Copy-Item $exe.FullName $dest
          "ASSET=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --title "视频扫描器 $env:GITHUB_REF_NAME" `
            --generate-notes `
            $env:ASSET
