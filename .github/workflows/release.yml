name: Release

# 推送 v* 标签时自动构建并发布 Release，产物为单文件绿色版 exe
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v6
        with:
          # 与 ci.yml 一致：必须钉死（理由见 ci.yml 的注释——staticcheck 读的
          # 编译器导出数据格式随 Go 版本递增），且 wails build 用同一工具链；
          # 三处（这里、ci.yml、go.mod 的 go 指令）必须同步改
          go-version: '1.27.2'
          cache: true

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 发版前必须过与 CI 相同的门槛：此前 release 只 build 不 check，
      # 于是"检查红灯的提交"照样能打出 exe 并发布出去。
      - name: 前端检查（svelte-check + 配置一致性）
        working-directory: frontend
        run: pnpm check

      # 必须在 wails build 之前（go:embed all:frontend/dist 要求 dist 有产物）
      - name: 前端构建
        working-directory: frontend
        run: pnpm build

      - name: gofmt 检查
        run: |
          $files = gofmt -l .
          if ($files) { Write-Host $files; exit 1 }

      - name: go vet
        run: go vet ./...

      # 与 ci.yml 相同的 staticcheck 门槛（发版前必须同样干净），版本也一致：
      # v0.8.2 起才支持 Go 1.27.2 的导出数据格式（v5）
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      # 与 ci.yml 相同的测试门槛（发版前必须同样干净）：只跑 -race，它是普通
      # go test 的超集；windows-latest 自带 MinGW 供 CGO 使用
      - name: go test -race
        run: go test -race ./...

      # tag 名与产品版本号必须一致：不对的话会发布一个"自称别的版本"的 exe，
      # 而那时 tag 已经推了（已发布过的 tag 不宜原地重打）。
      #
      # v3 没有 wails.json 了：进 exe 版本资源的是 build/windows/info.json
      # （generate:syso 直接读它），build/config.yml 的 info.version 是打包元数据。
      # 两者由 check-config-sync.mjs 断言一致，这里取前者。
      - name: 校验 tag 与产品版本号一致
        shell: pwsh
        run: |
          $version = (Get-Content build/windows/info.json -Raw | ConvertFrom-Json).info.'0409'.ProductVersion
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            Write-Host "tag 为 $env:GITHUB_REF_NAME，但 build/windows/info.json 的 ProductVersion 是 $version（应为 $expected）"
            exit 1
          }
          Write-Host "版本一致: $expected"

      # 与 ci.yml 相同：CLI 版本必须与 go.mod 的 wails/v3 一致
      - name: 安装 Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: wails3 build
        run: |
          $env:PATH += ";$(go env GOPATH)\bin"
          wails3 build

      # 产物文件名含中文（Taskfile.yml 的 APP_NAME），附件统一为 ASCII 名
      - name: 归一化产物文件名
        shell: pwsh
        run: |
          $exe = Get-ChildItem "build/bin/*.exe" | Select-Object -First 1
          $dest = "video-scanner-$($env:GITHUB_REF_NAME)-windows-amd64.exe"
          Copy-Item $exe.FullName $dest
          "ASSET=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --title "视频扫描器 $env:GITHUB_REF_NAME" `
            --generate-notes `
            $env:ASSET
